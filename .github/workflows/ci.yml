name: CI

# Frontend and backend gates from AGENTS.md. Every job must pass before merge, so
# they are deliberately independent: a Python type error must not hide a broken
# TypeScript build, and vice versa.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.x"
  PYTHON_VERSION: "3.13"
  PNPM_VERSION: "9.15.4"

jobs:
  web:
    name: Web (lint, types, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          # The build must not require real secrets; these are shape-only values.
          RAGDOLL_SESSION_SECRET: ci-session-secret-value-0123456789abcdef
          RAGDOLL_API_TOKEN: ci-engine-token-0123456789abcdef
      - name: Dependency audit
        run: pnpm audit --audit-level=high

  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff==0.8.6 mypy==1.14.1 pip-audit
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}/api
      - name: Dependency audit
        run: pip-audit --strict

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  type-sync:
    name: OpenAPI type sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r api/requirements.txt
      - name: Regenerate the contract
        run: |
          PYTHONPATH="$PWD/api" python api/tools/export_openapi.py
          pnpm exec openapi-typescript api/openapi.json -o src/lib/pipeline/api-schema.d.ts
      - name: Fail on drift
        run: |
          if ! git diff --quiet -- api/openapi.json src/lib/pipeline/api-schema.d.ts; then
            echo "::error::The engine schema changed without regenerating src/lib/pipeline/api-schema.d.ts."
            echo "Run: PYTHONPATH=\$PWD/api python api/tools/export_openapi.py && pnpm api:types"
            git --no-pager diff --stat -- api/openapi.json src/lib/pipeline/api-schema.d.ts
            exit 1
          fi

  e2e:
    name: E2E (Playwright)
    # Pull requests only: the journey needs the engine, and running it on every
    # push to main roughly doubles CI minutes for no extra signal.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r api/requirements.txt
          pnpm exec playwright install --with-deps chromium
      - name: Start the offline engine
        run: |
          RAGDOLL_DEV_PROVIDER=1 RAGDOLL_API_TOKEN=ci-engine-token-0123456789abcdef \
            python -m uvicorn main:app --port 8123 --app-dir api &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/health && break
            sleep 1
          done
      - name: Start the app
        run: |
          pnpm build
          RAGDOLL_SESSION_SECRET=ci-session-secret-value-0123456789abcdef \
          RAGDOLL_API_TOKEN=ci-engine-token-0123456789abcdef \
          RAGDOLL_API_URL=http://127.0.0.1:8123 \
          RAGDOLL_HOSTED=0 \
          pnpm start --port 3000 &
          for attempt in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
      - name: Playwright
        run: pnpm e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          RAGDOLL_API_URL: http://127.0.0.1:8123
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
