name: CI

# Gates from AGENTS.md. Every job must pass before merge, so they are deliberately
# independent: a type error must not hide a broken build, and vice versa.
#
# There is no separate API job any more: the RAG pipeline is TypeScript inside the
# Next.js app, so the web job covers it and CodeQL has one language to scan.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.x"
  PNPM_VERSION: "9.15.4"

jobs:
  web:
    name: Web (lint, types, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          # The build must not require real secrets; this is a shape-only value.
          RAGDOLL_SESSION_SECRET: ci-session-secret-value-0123456789abcdef
      - name: Dependency audit
        run: pnpm audit --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  e2e:
    name: E2E (Playwright)
    # Pull requests only: the journey needs a full build, and running it on every
    # push to main roughly doubles CI minutes for no extra signal.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start the app
        run: |
          pnpm build
          RAGDOLL_SESSION_SECRET=ci-session-secret-value-0123456789abcdef \
          RAGDOLL_DEV_PROVIDER=1 \
          RAGDOLL_HOSTED=0 \
          pnpm start --port 3000 &
          for attempt in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
      - name: Playwright
        run: pnpm e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
